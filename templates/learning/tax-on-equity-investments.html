<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax on Equity Investments</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <h2>Tax on Equity Investments</h2>
        <h3>Equity Share Taxation</h3>
        <ul>
            <li><strong>LTCG (Held for over 1 year):</strong> 10% tax on gains above ₹1 lakh.</li>
            <li><strong>STCG (Held for less than 1 year):</strong> 15% flat tax.</li>
        </ul>
        <h3>Equity Mutual Funds Taxation</h3>
        <ul>
            <li><strong>LTCG (1+ years):</strong> 10% on gains over ₹1 lakh.</li>
            <li><strong>STCG (Less than 1 year):</strong> 15% tax.</li>
        </ul>
    </div>
</body>
</html>
