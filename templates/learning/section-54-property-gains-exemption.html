    <title>Section 54 – Property Gains Exemption</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <h2>Section 54 – Property Gains Exemption</h2>
        <ul>
            <li>Exempts LTCG from property sales if reinvested in <strong>another residential property</strong> within <strong>2 years</strong>.</li>
            <li>Can buy <strong>1 or 2 properties</strong> (if LTCG is < ₹2 crore).</li>
            <li>The new property must be <strong>held for 3+ years</strong> to keep exemption.</li>
        </ul>
    </div>
</body>
</html>
